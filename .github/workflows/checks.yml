name: Pilot checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: server/requirements.lock
      - run: npm ci
      - run: pip install -r server/requirements-dev.txt
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: ruff check server
      - run: ruff format --check server
      - run: python -m pytest server/tests
